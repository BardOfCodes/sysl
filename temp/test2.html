<script type="module">


  // UBO Loader - Handles Uniform Buffer Object decompression and management

// Global UBO storage
const globalUBOs = {};

/**
 * Decompresses base64-encoded, zlib-compressed UBO data
 * @param {string} data_b64 - Base64 encoded compressed data
 * @param {Array} shape - Array shape [T, K] where T is time steps, K is data size
 * @param {string} dtype - Data type (should be 'float32')
 * @returns {Float32Array} Decompressed float array
 */
function decompressUBOData(data_b64, shape, dtype) {
  try {
    // Decode base64
    const binaryString = atob(data_b64);
    const compressedBytes = new Uint8Array(binaryString.length);
    for (let i = 0; i < binaryString.length; i++) {
      compressedBytes[i] = binaryString.charCodeAt(i);
    }
    
    // Decompress using pako (zlib)
    const decompressedBytes = pako.inflate(compressedBytes);
    
    // Convert to typed array based on dtype
    let typedArray;
    if (dtype === 'float32') {
      typedArray = new Float32Array(decompressedBytes.buffer);
    } else if (dtype === 'float64') {
      typedArray = new Float64Array(decompressedBytes.buffer);
    } else {
      throw new Error(`Unsupported dtype: ${dtype}`);
    }
    
    // Verify shape
    const expectedSize = shape.reduce((a, b) => a * b, 1);
    if (typedArray.length !== expectedSize) {
      throw new Error(`Shape mismatch: expected ${expectedSize}, got ${typedArray.length}`);
    }
    
    return typedArray;
  } catch (error) {
    console.error('Error decompressing UBO data:', error);
    throw error;
  }
}

/**
 * Creates a WebGL Uniform Buffer Object
 * @param {WebGL2RenderingContext} gl - WebGL context
 * @param {Float32Array} data - Float data array
 * @param {number} binding - UBO binding point
 * @returns {Object} UBO object with buffer and binding info
 */
function createUBO(gl, data, binding) {
  // Create buffer
  const buffer = gl.createBuffer();
  gl.bindBuffer(gl.UNIFORM_BUFFER, buffer);
  gl.bufferData(gl.UNIFORM_BUFFER, data, gl.DYNAMIC_DRAW);
  
  // Bind to binding point
  gl.bindBufferBase(gl.UNIFORM_BUFFER, binding, buffer);
  
  return {
    buffer: buffer,
    binding: binding,
    data: data,
    size: data.length * 4  // 4 bytes per float
  };
}

/**
 * Updates UBO buffer data
 * @param {WebGL2RenderingContext} gl - WebGL context
 * @param {Object} ubo - UBO object
 * @param {Float32Array} newData - New data array
 * @param {number} offset - Byte offset (default 0)
 */
function updateUBO(gl, ubo, newData, offset = 0) {
  gl.bindBuffer(gl.UNIFORM_BUFFER, ubo.buffer);
  gl.bufferSubData(gl.UNIFORM_BUFFER, offset, newData);
  ubo.data = newData;
}

/**
 * Initializes all UBOs from the template data
 * @param {WebGL2RenderingContext} gl - WebGL context
 * @param {Object} uboData - UBO uniform data from template
 */
function initializeUBOs(gl, uboData) {
  console.log('Initializing UBOs:', Object.keys(uboData));
  
  for (const [uboName, uboInfo] of Object.entries(uboData)) {
    try {
      console.log(`Processing UBO: ${uboName}`, uboInfo);
      
      // Decompress the data
      const decompressedData = decompressUBOData(
        uboInfo.data_b64,
        uboInfo.shape,
        uboInfo.dtype
      );
      
      console.log(`Decompressed ${uboName}:`, {
        shape: uboInfo.shape,
        dataLength: decompressedData.length,
        binding: uboInfo.binding,
        isMultiParam: uboInfo.n_params > 1
      });
      
      // For multi-parameter UBOs, only upload the first parameter set initially
      let initialData = decompressedData;
      if (uboInfo.n_params && uboInfo.n_params > 1) {
        const [N, K] = uboInfo.shape;
        initialData = decompressedData.slice(0, K); // Use first parameter set
        console.log(`Multi-param UBO: Using first parameter set (${K} values of ${decompressedData.length})`);
      }
      
      // Create UBO with initial data
      const ubo = createUBO(gl, initialData, uboInfo.binding);
      
      // Store globally
      globalUBOs[uboName] = {
        ...ubo,
        shape: uboInfo.shape,
        n_params: uboInfo.n_params,
        dtype: uboInfo.dtype
      };
      
      console.log(`UBO ${uboName} created successfully`);
      
    } catch (error) {
      console.error(`Error initializing UBO ${uboName}:`, error);
    }
  }
  
  // Unbind buffer
  gl.bindBuffer(gl.UNIFORM_BUFFER, null);
}

/**
 * Gets UBO by name
 * @param {string} name - UBO name
 * @returns {Object|null} UBO object or null if not found
 */
function getUBO(name) {
  return globalUBOs[name] || null;
}

/**
 * Updates UBO for animation (selects time step)
 * @param {WebGL2RenderingContext} gl - WebGL context
 * @param {string} uboName - UBO name
 * @param {number} timeStep - Time step index (0-based)
 */
function setUBOTimeStep(gl, uboName, timeStep = 0) {
  const ubo = globalUBOs[uboName];
  if (!ubo) {
    console.warn(`UBO ${uboName} not found`);
    return;
  }
  
  const [T, K] = ubo.shape;
  if (timeStep >= T) {
    console.warn(`Time step ${timeStep} out of range (max: ${T-1})`);
    return;
  }
  
  // Extract the data for this time step
  const startIdx = timeStep * K;
  const endIdx = startIdx + K;
  const timeStepData = ubo.data.slice(startIdx, endIdx);
  
  // Update buffer with this time step's data
  gl.bindBuffer(gl.UNIFORM_BUFFER, ubo.buffer);
  gl.bufferSubData(gl.UNIFORM_BUFFER, 0, timeStepData);
  
  console.log(`Updated UBO ${uboName} to time step ${timeStep}`);
}

/**
 * Links uniform block in shader program to UBO binding point
 * @param {WebGL2RenderingContext} gl - WebGL context
 * @param {WebGLProgram} program - Shader program
 * @param {string} blockName - Uniform block name in shader
 * @param {number} binding - UBO binding point
 */
function linkUniformBlock(gl, program, blockName, binding) {
  const blockIndex = gl.getUniformBlockIndex(program, blockName);
  if (blockIndex !== gl.INVALID_INDEX) {
    gl.uniformBlockBinding(program, blockIndex, binding);
    console.log(`Linked uniform block '${blockName}' to binding ${binding}`);
  } else {
    console.warn(`Uniform block '${blockName}' not found in shader`);
  }
}

/**
 * Sets up all UBO bindings for a shader program
 * @param {WebGL2RenderingContext} gl - WebGL context
 * @param {WebGLProgram} program - Shader program
 */
function setupUBOBindings(gl, program) {
  for (const [uboName, ubo] of Object.entries(globalUBOs)) {
    // The uniform block name in the shader should match the UBO name
    linkUniformBlock(gl, program, uboName, ubo.binding);
  }
}

// Export for external use if needed
window.UBOLoader = {
  decompressUBOData,
  createUBO,
  updateUBO,
  initializeUBOs,
  getUBO,
  setUBOTimeStep,
  linkUniformBlock,
  setupUBOBindings,
  globalUBOs
};

// Module: Voronoi
vec3 Voronoi( in vec3 x )
{
    vec3 p = floor( x );
    vec3 f = fract( x );
	float id = 0.0;
    vec2 res = vec2( 100.0 );
    for( int k=-1; k<=1; k++ )
    for( int j=-1; j<=1; j++ )
    for( int i=-1; i<=1; i++ )
    {
        vec3 b = vec3( float(i), float(j), float(k) );
        vec3 r = vec3( b ) - f + Hash( p + b );
        float d = dot( r, r );
        if( d < res.x )
        {
			id = dot( p+b, vec3(1.0,57.0,113.0 ) );
            res = vec2( d, res.x );			
        }
        else if( d < res.y )
        {
            res.y = d;
        }
    }
    return vec3( sqrt( res ), abs(id) );
}

// Module: Noise
float Noise(in vec3 p)
{
    vec3 i = floor(p);
    vec3 f = fract(p);
    f = f*f*(3.0-2.0*f);
    return mix(mix(mix( Hash(i+vec3(0,0,0)), 
                        Hash(i+vec3(1,0,0)),f.x),
                   mix( Hash(i+vec3(0,1,0)), 
                        Hash(i+vec3(1,1,0)),f.x),f.y),
               mix(mix( Hash(i+vec3(0,0,1)), 
                        Hash(i+vec3(1,0,1)),f.x),
                   mix( Hash(i+vec3(0,1,1)), 
                        Hash(i+vec3(1,1,1)),f.x),f.y),f.z);
}

vec3 totalRayleigh()
{
    return (8.0 * pow(PI, 3.0) * pow(pow(_AS_n, 2.0) - 1.0, 2.0) * (6.0 + 3.0 * _AS_pn)) / (3.0 * _AS_N * pow(_lambda, vec3(4.0)) * (6.0 - 7.0 * _AS_pn));
}
float rayleighPhase(float cosTheta)
{
    return (3.0 / (16.0*PI)) * (1.0 + pow(cosTheta, 2.0));
}
vec3 totalMie()
{
    float c = (0.2 * _turbidity) * 10E-18;
    return 0.434 * c * PI * pow((2.0 * PI) / _lambda, vec3(_V - 2.0)) * _K;
}
float hgPhase(float cosTheta, float g)
{
    return (1.0 / (4.0*PI)) * ((1.0 - pow(g, 2.0)) / pow(1.0 - 2.0*g*cosTheta + pow(g, 2.0), 1.5));
}
float sunIntensity(float zenithAngleCos)
{

void AtmosphericScattering(DirectionalLight light, vec3 worldNormal, 
    out float cosTheta, out vec3 Lin, out vec3 Fex) 
{
    vec3 lightDirection = light.direction;
    float lightEnergy = light.energy;
    float sunfade = 1.0-clamp(1.0- exp(light.direction.z / 450000.0) ,0.0,1.0);
    float reileigh = _reileighCoefficient - (1.0-sunfade);
    vec3 betaR = totalRayleigh() * reileigh;
    vec3 betaM = totalMie() * _mieCoefficient;
    float zenithAngle = acos(max(0.0, dot(_up, worldNormal)));
    float sR = _rayleighZenithLength / (cos(zenithAngle) + 0.15 * pow(93.885 - ((zenithAngle * 180.0) / PI), -1.253));
    float sM = _mieZenithLength / (cos(zenithAngle) + 0.15 * pow(93.885 - ((zenithAngle * 180.0) / PI), -1.253));
    Fex = exp(-(betaR * sR + betaM * sM));
    cosTheta = dot(worldNormal, lightDirection);
    float rPhase = rayleighPhase(cosTheta*0.5+0.5);
    vec3 betaRTheta = betaR * rPhase;
    float mPhase = hgPhase(cosTheta, _mieDirectionalG);
    vec3 betaMTheta = betaM * mPhase;
    Lin = pow(lightEnergy * ((betaRTheta + betaMTheta) / (betaR + betaM)) * (1.0 - Fex),vec3(1.5));
    Lin *= mix(vec3(1.0),pow(lightEnergy * ((betaRTheta + betaMTheta) / (betaR + betaM)) * Fex,vec3(1.0/2.0)),clamp(pow(1.0-dot(_up, lightDirection),5.0),0.0,1.0));
}
vec3 Sky(DirectionalLight sun, vec3 viewDir) {
    float cosElevOffset = cos(backgroundElevation);

    float newX = rotatedViewDir.x * cosAzimOffset - rotatedViewDir.z * sinAzimOffset;
    float newZ = rotatedViewDir.x * sinAzimOffset + rotatedViewDir.z * cosAzimOffset;
    rotatedViewDir.x = newX;
    rotatedViewDir.z = newZ;
    float newY = rotatedViewDir.y * cosElevOffset - rotatedViewDir.z * sinElevOffset;
    newZ = rotatedViewDir.y * sinElevOffset + rotatedViewDir.z * cosElevOffset;
    rotatedViewDir.y = newY;
    rotatedViewDir.z = newZ;

    vec3 Fex;

vec3 SkyExtinxtion(DirectionalLight light) 
{
    float sunfade = 1.0-clamp(1.0-exp(light.direction.z),0.0,1.0);
    float reileigh = _reileighCoefficient - (1.0-sunfade);
    vec3 betaR = totalRayleigh() * reileigh;
    vec3 betaM = totalMie() * _mieCoefficient;
    float zenithAngle = acos(max(0.0, dot(_up, light.direction)));
    float sR = _rayleighZenithLength / (cos(zenithAngle) + 0.15 * pow(93.885 - ((zenithAngle * 180.0) / PI), -1.253));
    float sM = _mieZenithLength / (cos(zenithAngle) + 0.15 * pow(93.885 - ((zenithAngle * 180.0) / PI), -1.253));
    return exp(-(betaR * sR + betaM * sM));
}
vec3 Env(vec3 view, DirectionalLight sun) {
    float cosTheta;
    vec3 Lin;
    vec3 Fex;
    AtmosphericScattering(sun, view, cosTheta, Lin, Fex);
    vec3 L0 = Fex * 0.1;
    vec3 texColor = (Lin+L0) * 0.04;
    texColor += vec3(0.0,0.001,0.0025)*0.3;
    return texColor;
}
vec3 SkyAmbient(DirectionalLight sun) {
    return Env(normalize(sun.direction*1.8 + vec3(0,0,1)), sun);
}
float phong_diffuse()
{
    return (1.0 / PI);
}
vec3 fresnel_factor(in vec3 f0, in float product)
{
    return mix(f0, vec3(1.0), pow(1.01 - product, 5.0));
}
float D_blinn(in float roughness, in float NdH)
{
    float m = roughness * roughness;
    float m2 = m * m;
    float n = 2.0 / m2 - 2.0;
    return (n + 2.0) / (2.0 * PI) * pow(NdH, n);
}
float D_beckmann(in float roughness, in float NdH)
{
    float m = roughness * roughness;
    float m2 = m * m;
    float NdH2 = NdH * NdH;
    return exp((NdH2 - 1.0) / (m2 * NdH2)) / (PI * m2 * NdH2 * NdH2);
}
float D_GGX(in float roughness, in float NdH)
{
    float m = roughness * roughness;
    float m2 = m * m;
    float d = (NdH * m2 - NdH) * NdH + 1.0;
    return m2 / (PI * d * d);
}
float G_schlick(in float roughness, in float NdV, in float NdL)
{
    float k = roughness * roughness * 0.5;
    float _V = NdV * (1.0 - k) + k;
    float L = NdL * (1.0 - k) + k;
    return 0.25 / (_V * L);
}
vec3 cooktorrance_specular(in float NdL, in float NdV, in float NdH, in vec3 specular, in float roughness)
{
#if SPECULAR_MODE == SPECULAR_BLINN
    float D = D_blinn(roughness, NdH);
#elif SPECULAR_MODE == SPECULAR_BECKMANN
    float D = D_beckmann(roughness, NdH);
#elif SPECULAR_MODE == SPECULAR_GGX
    float D = D_GGX(roughness, NdH);
#endif
    float G = G_schlick(roughness, NdV, NdL);
    float rim = mix(1.0 - roughness * 0.9, 1.0, NdV);
    return max((1.0 / rim) * specular * G * D, 0.0);
}
float Specular(vec3 l, vec3 n, vec3 r, float k)
{
    vec3 half_dir = normalize(l + r);
    float spec_angle = max(dot(half_dir, n), 0.0);

float AmbientOcclusion(vec3 p,vec3 n) {
    const float SCALE = _AO_MAX_DIST / pow(2.0, float(_AO_STEPS))*2.0;
    float ocl = 0.0;
    for(int i = 1; i <= _AO_STEPS; ++i) {
        float dist = pow(2.0, float(i)) * SCALE;
        ocl += 1.0 - (max(0.0, SCENE_EXPRESSION(p + n * dist).x) / dist);
    }
    return min(1.0-(ocl / float(_AO_STEPS)),1.0);
}
float Shadow(vec3 p,vec3 l, float d, float r)
{
    float res = 1.0;
    float t = 0.1;
    for (int i = 0; i < _SHADOW_MAX_STEPS; ++i) {
        if (res < 0.0 || t > d)
            break;
        float h = SCENE_EXPRESSION(p+t*l).x;
        res = min(res, r * h / t);
        t += h;    
    }    
    return clamp(res, 0.0, 1.0);

vec3 Shade(DirectionalLight sun, Material mat, vec3 p, vec3 rd, vec3 n, 
    vec3 reflection, vec3 clearcoat) 
{
    vec3 ambient = SkyAmbient(sun) * 0.7;
    ambient *= AmbientOcclusion(p, n);
    vec3 specular = mix(vec3(0.02), mat.albedo, mat.mrc.x);
    vec3 L = sun.direction;
    vec3 N = n;
    vec3 _V = -rd;
    vec3 H = normalize(_V+L);
    float NdL = max(0.000, dot(N, L));
    float NdV = max(0.001, dot(N, _V));
    float NdH = max(0.001, dot(N, H));
    float HdV = max(0.001, dot(H, _V));
    vec3 specfresnel = fresnel_factor(specular, HdV);
    vec3 specref = cooktorrance_specular(NdL, NdV, NdH, specfresnel, mat.mrc.y);
    specref *= vec3(NdL);
    vec3 diffref = (vec3(1.0) - specfresnel) * phong_diffuse() * NdL;
    float s = Shadow(p+n*0.1, L, sun.shadow_dist, 20.0);
    vec3 reflected_light = vec3(0);
    vec3 diffuse_light = vec3(0);
    vec3 light_color = sun.color * sun.energy * 0.01;
    reflected_light += specref * light_color * s;
    diffuse_light += diffref * light_color * s;
    reflected_light += min(vec3(0.99), fresnel_factor(specular, NdV)) * reflection;
    reflected_light += min(vec3(0.99), fresnel_factor(vec3(0.02), NdV)) * clearcoat * 0.2;
    diffuse_light += ambient * (1.0 / PI);
    vec3 result = diffuse_light * mix(mat.albedo, vec3(0.0), mat.mrc.x);
    result += reflected_light;
    result += mat.emissive;
    return result;
}

vec3 SCENE_NORMAL(in vec3 p )
{

// Module: SphereTrace_v4
MATPoint SphereTrace(in vec3 ro, in vec3 rd, float e, out bool _h,out int _s){
    MATPoint res;
    res.x = -1.0;
    float b = dot(ro, ro) - _SCENE_RADIUS*_SCENE_RADIUS;
    float c = dot(ro, rd);
    float disc = c*c - b;
    if (disc <= 0.0) {
        _h = false;
        _s = 0;
        return res;
    }
    float s   = sqrt(disc);
    float t0  = -c - s;
    float t1  = -c + s;
    if (t1 < 0.0) {
        _h = false;
        _s = 0;
        return res;
    }                   // both intersections behind camera
    float tmin = max(1.0, t0);
    float tmax = min(20.0, t1);
    if (_ADD_FLOOR_PLANE) {
        float tp = -ro.y / rd.y;
        if (tp > 0.0 && tp < tmax) {
            tmax = tp;
            res.x = tp;
            _h = true;
            _s = 0;
        }
    }
    vec3 inv_rd = 1.0 / rd;  // hoist reciprocal
    vec3 tA = ( _SCENE_BOX_CENTER - _SCENE_BOX_SIZE - ro ) * inv_rd;
    vec3 tB = ( _SCENE_BOX_CENTER + _SCENE_BOX_SIZE - ro ) * inv_rd;
    vec3 tMin3 = min(tA, tB);
    vec3 tMax3 = max(tA, tB);
    float tbmin = max( max(tMin3.x, tMin3.y), tMin3.z );
    float tbmax = min( min(tMax3.x, tMax3.y), tMax3.z );
    if (tbmin < tbmax && tbmax > 0.0 && tbmin < tmax) {
        tmin = max(tmin, tbmin);
        tmax = min(tmax, tbmax);
        float t = tmin;
        for (int i = _ZERO; i < _RAYCAST_MAX_STEPS && t < tmax; i++) {
            MATPoint h = SCENE_EXPRESSION(ro + rd * t);
            if (abs(h.x) < 0.0001 * t) {
                res.x = t;
                res.mat = h.mat;
                _h = true;
                _s = i;
                break;
            }
            t += h.x * _RAYCAST_CONSERVATIVE_STEPPING_RATE;
        }
    }
    return res;
}

DirectionalLight BasicSun()
{

    sun.color = SkyExtinxtion(sun)* 19.0;
    sun.energy = sunIntensity(max(0.0, sun.direction.z)) * _EE;

// Module: ShadeRay_v4
vec3 ShadeRay_v4(DirectionalLight sun, vec3 ro, vec3 rd, out int steps) {
    bool hit = false;
    int s = 0;
    MATPoint res = SphereTrace(ro, rd, 100.0, hit, s);
    float t = res.x;
    Material mat = res.mat;
    steps += s;
    vec3 pt = ro + t * rd;
    if (!hit)
        return background(rd, sun);
    vec3 n = SCENE_NORMAL(pt);
    vec3 reflect_dir = reflect(rd, n);
    vec3 clearcoat = vec3(0);
    vec3 reflection;
    if (mat.mrc.z > 0.0 || mat.mrc.y == 0.0) {
        s = 0;
        res = SphereTrace(pt+n*0.01, reflect_dir, 100.0, hit, s);
        t = res.x;
        steps += s;
        if (hit) {
            vec3 rpt = pt + t * reflect_dir;
            vec3 rn = SCENE_NORMAL(rpt);
            vec3 sec_reflection = Env(reflect(reflect_dir, rn), sun);
            clearcoat = Shade(sun, res.mat, rpt, reflect_dir, rn, 
                            sec_reflection, sec_reflection*mat.mrc.z);
        } else
            clearcoat = Env(reflect_dir, sun);
    }
    if (mat.mrc.y == 0.0)
        reflection = clearcoat;
    else {
        float r = 1.0/max(mat.mrc.y, 0.00001);
        float v = Shadow(pt+n*0.1, reflect_dir, 1000.0, r);
        reflection = mix(SkyAmbient(sun)*0.1, Env(reflect_dir, sun), v);
    }
    clearcoat *= mat.mrc.z;
    return Shade(sun, mat, pt, rd, n, reflection, clearcoat);
}

    color = vec4( tot, 1.0 );
}

      const worldUp = [0, 1, 0];

        forward[2] * worldUp[0] - forward[0] * worldUp[2],
        forward[0] * worldUp[1] - forward[1] * worldUp[0],

const float SCENE_RADIUS = 100.0;
const vec3 BOX_CENTER    = vec3(0.0, 0.5, 0.0);
const vec3 BOX_HALF_SIZE = vec3(10.0, 5.0, 10.0);


vec2 raycast(in vec3 ro, in vec3 rd) {

    vec2 res = vec2(-1.0,-1.0);

    // 1) Sphere cull: cheap dot/mul vs. complex SDF
    float b = dot(ro, ro) - SCENE_RADIUS*SCENE_RADIUS;
    float c = dot(ro, rd);
    float disc = c*c - b;
    if (disc <= 0.0) return res;                // no intersection with sphere
    float s   = sqrt(disc);
    float t0  = -c - s;
    float t1  = -c + s;
    if (t1 < 0.0) return res;                   // both intersections behind camera

    float tmin = max(1.0, t0);
    float tmax = min(20.0, t1);

    // 2) Floor-plane (y=0) test
    float tp = -ro.y / rd.y;
    if (tp > 0.0 && tp < tmax) {
        tmax = tp;
        res = vec2(tp, 1.0);
    }

    // 3) AABB test
    vec3 inv_rd = 1.0 / rd;  // hoist reciprocal
    vec3 tA = ( BOX_CENTER - BOX_HALF_SIZE - ro ) * inv_rd;
    vec3 tB = ( BOX_CENTER + BOX_HALF_SIZE - ro ) * inv_rd;

    vec3 tMin3 = min(tA, tB);
    vec3 tMax3 = max(tA, tB);

    float tbmin = max( max(tMin3.x, tMin3.y), tMin3.z );
    float tbmax = min( min(tMax3.x, tMax3.y), tMax3.z );

    if (tbmin < tbmax && tbmax > 0.0 && tbmin < tmax) {
        tmin = max(tmin, tbmin);
        tmax = min(tmax, tbmax);

        // 4) Ray‐march only in [tmin, tmax]
        float t = tmin;
        for (int i = 0; i < 70 && t < tmax; i++) {
            vec2 h = OBJECT_SDF_AND_MATERIAL(ro + rd * t);
            if (abs(h.x) < 0.0001 * t) {
                res = vec2(t, h.y);
                break;
            }
            t += h.x;
        }
    }

    return res;
}


float calcSoftshadow( in vec3 ro, in vec3 rd, in float mint, in float tmax )
{
    // bounding volume
    float tp = (0.8-ro.y)/rd.y; 
    if( tp>0.0 ) tmax = min( tmax, tp );

    float res = 1.0;
    float t = mint;
    for( int i=0; i<64; i++ )
    {
		float h = OBJECT_SDF_AND_MATERIAL( ro + rd*t ).x;
        float s = clamp(8.0*h/t,0.0,1.0);
        res = min( res, s );
        t += clamp( h, 0.01, 0.2 );
        if( res<0.004 || t>tmax ) break;
    }
    res = clamp( res, 0.0, 1.0 );
    return res*res*(3.0-2.0*res);

vec3 calcNormal( in vec3 pos )
{
    // inspired by tdhooper and klems - a way to prevent the compiler from inlining OBJECT_SDF_AND_MATERIAL() 4 times
    vec3 n = vec3(0.0);
    for( int i=0; i<4; i++ )
    {
        vec3 e = 0.5773*(2.0*vec3((((i+3)>>1)&1),((i>>1)&1),(i&1))-1.0);
        n += e*OBJECT_SDF_AND_MATERIAL(pos+0.0005*e).x;

    }
    return normalize(n);
}



// https://iquilezles.org/articles/nvscene2008/rwwtt.pdf
float calcAO( in vec3 pos, in vec3 nor )
{
	float occ = 0.0;
    float sca = 1.0;
    for( int i=0; i<5; i++ )
    {
        float h = 0.01 + 0.12*float(i)/4.0;
        float d = OBJECT_SDF_AND_MATERIAL( pos + h*nor ).x;
        occ += (h-d)*sca;
        sca *= 0.95;
        if( occ>0.35 ) break;
    }
    return clamp( 1.0 - 3.0*occ, 0.0, 1.0 ) * (0.5+0.5*nor.y);

// https://iquilezles.org/articles/checkerfiltering
float checkersGradBox( in vec2 p, in vec2 dpdx, in vec2 dpdy )
{
    // filter kernel
    vec2 w = abs(dpdx)+abs(dpdy) + 0.001;
    // analytical integral (box filter)
    vec2 i = 2.0*(abs(fract((p-0.5*w)*0.5)-0.5)-abs(fract((p+0.5*w)*0.5)-0.5))/w;
    // xor pattern
    return 0.5 - 0.5*i.x*i.y;                  
}

struct Material {
    vec3 albedo;
    float ks;
};

// Choose material properties based on hit id
Material getMaterial(float m, vec3 pos, vec3 ro, vec3 rd, vec3 rdx, vec3 rdy) {
    Material mat;
    if (m < 1.5) {
        // Floor checker
        vec3 dpdx = ro.y * (rd / rd.y - rdx / rdx.y);
        vec3 dpdy = ro.y * (rd / rd.y - rdy / rdy.y);
        float f = checkersGradBox(3.0 * pos.xz, 3.0 * dpdx.xz, 3.0 * dpdy.xz);
        mat.albedo = vec3(0.15) + f * vec3(0.05);
        mat.ks     = 0.4;
    } else {
        // Object color
        mat.albedo = 0.2 + 0.2 * sin(m * 2.0 + vec3(0.0, 1.0, 2.0));
        mat.ks     = 1.0;
    }
    return mat;
}

// Compute lighting for a hit
vec3 calcLighting(vec3 pos, vec3 nor, vec3 ref, vec3 rd, Material mat, vec3 lig) {
    float occ = calcAO(pos, nor);
    vec3 lin = vec3(0.0);

    // Sun light
    // vec3 lig = normalize(vec3(-0.5, 0.4, -0.6));
    vec3 hal = normalize(lig - rd);
    float dif = clamp(dot(nor, lig), 0.0, 1.0);
    dif *= calcSoftshadow(pos, lig, 0.02, 2.5);
    float spe = pow(clamp(dot(nor, hal), 0.0, 1.0), 16.0);
    spe *= dif * (0.04 + 0.96 * pow(clamp(1.0 - dot(hal, lig), 0.0, 1.0), 5.0));
    lin += mat.albedo * 2.2 * dif * vec3(1.3, 1.0, 0.7);
    lin += 5.0 * spe * vec3(1.3, 1.0, 0.7) * mat.ks;

    // Sky light
    dif = sqrt(clamp(0.5 + 0.5 * nor.y, 0.0, 1.0));
    dif *= occ;
    spe = smoothstep(-0.2, 0.2, ref.y);
    spe *= dif * (0.04 + 0.96 * pow(clamp(1.0 + dot(nor, rd), 0.0, 1.0), 5.0));
    spe *= calcSoftshadow(pos, ref, 0.02, 2.5);
    lin += mat.albedo * 0.6 * dif * vec3(0.4, 0.6, 1.15);
    lin += 2.0 * spe * vec3(0.4, 0.6, 1.30) * mat.ks;

    // Back light
    dif = clamp(dot(nor, normalize(vec3(0.5, 0.0, 0.6))), 0.0, 1.0) * clamp(1.0 - pos.y, 0.0, 1.0);
    dif *= occ;
    lin += mat.albedo * 0.55 * dif * vec3(0.25);

    // Subsurface
    dif = pow(clamp(1.0 + dot(nor, rd), 0.0, 1.0), 2.0);
    dif *= occ;
    lin += mat.albedo * 0.25 * dif;

    return lin;
}

// Cleaned-up render function
vec3 render(in vec3 ro, in vec3 rd, in vec3 rdx, in vec3 rdy, vec3 lig) {
    // Background
    vec3 bg = vec3(0.7, 0.7, 0.9) - max(rd.y, 0.0) * 0.3;

    // Raycast
    vec2 hit = raycast(ro, rd);
    if (hit.x < 0.0) return bg;

    float t  = hit.x;
    float m  = hit.y;
    vec3  pos = ro + rd * t;
    vec3  nor = (m < 1.5) ? vec3(0.0, 1.0, 0.0) : calcNormal(pos);
    vec3  ref = reflect(rd, nor);

    // Material determination
    Material mat = getMaterial(m, pos, ro, rd, rdx, rdy);

    // Lighting
    vec3 color = calcLighting(pos, nor, ref, rd, mat, lig);

    // Fog
    float fogFactor = 1.0 - exp(-0.0001 * t * t * t);
    return mix(color, bg, fogFactor);
}

    tot /= float(AA*AA);
    
    fragColor = vec4( tot, 1.0 );

  // Common save render functionality
  function saveRender(renderFunction) {
    try {
      // Force a render to ensure the current frame is captured
      if (renderFunction) {
        renderFunction();
        
        // Ensure WebGL commands are executed
        gl.finish();
        
        // Read pixels from the framebuffer
        const width = canvas.width;
        const height = canvas.height;
        const pixels = new Uint8Array(width * height * 4);
        gl.readPixels(0, 0, width, height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        
        // Create a temporary canvas to process the pixel data
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = width;
        tempCanvas.height = height;
        const tempCtx = tempCanvas.getContext('2d');
        
        // Create ImageData from the pixels
        const imageData = new ImageData(width, height);
        
        // Copy and flip the pixels (WebGL has origin at bottom-left, canvas at top-left)
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const srcIndex = ((height - 1 - y) * width + x) * 4;
            const dstIndex = (y * width + x) * 4;
            imageData.data[dstIndex] = pixels[srcIndex];         // R
            imageData.data[dstIndex + 1] = pixels[srcIndex + 1]; // G
            imageData.data[dstIndex + 2] = pixels[srcIndex + 2]; // B
            imageData.data[dstIndex + 3] = pixels[srcIndex + 3]; // A
          }
        }
        
        // Put the image data on the temporary canvas
        tempCtx.putImageData(imageData, 0, 0);
        
        // Convert to blob and download
        tempCanvas.toBlob((blob) => {
          if (blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `shader_render_${Date.now()}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            console.log('Render saved successfully');
          } else {
            console.error('Failed to create blob from canvas');
          }
        }, 'image/png');
      } else {
        console.error('No shader loaded to save');
      }
    } catch (error) {
      console.error('Error saving render:', error);
    }
  }

    document.getElementById('canvasHeight').value = 512;
    document.getElementById('canvasWidth_value').textContent = '512';
    document.getElementById('canvasHeight_value').textContent = '512';
    document.getElementById('canvas-container').style.width = '512px';
    document.getElementById('canvas-container').style.height = '512px';
    resizeCanvas();
  }
   





  // === ReGL-specific code ===
  const regl = createREGL({ gl });

  // Extract UBO registry from Jinja
  const uboRegistry = {
    
    "UBO_PARAMS": {"binding": 0, "data_b64": "eJxjYGCwZ4BiY2NjEM0AomGYASHPMGvmTDsGhgYwGz9AVgNiY9ODqubsmTO2EPYBZHsZAM0JD9g=", "dtype": "float32", "n_params": 1, "n_vec4s": 10, "param_shape": null, "shape": [1, 40], "type": "uniform_buffer", "var_mapping": {"var_0": {"components": "w", "type": "float", "vec4_index": 0}, "var_1": {"components": "xyz", "type": "vec3", "vec4_index": 0}, "var_10": {"components": "xyz", "type": "vec3", "vec4_index": 7}, "var_11": {"components": "xyz", "type": "vec3", "vec4_index": 8}, "var_12": {"components": "xyz", "type": "vec3", "vec4_index": 9}, "var_2": {"components": "w", "type": "float", "vec4_index": 1}, "var_3": {"components": "xyz", "type": "vec3", "vec4_index": 1}, "var_4": {"components": "xyz", "type": "vec3", "vec4_index": 2}, "var_5": {"components": "xyz", "type": "vec3", "vec4_index": 3}, "var_6": {"components": "xyz", "type": "vec3", "vec4_index": 4}, "var_7": {"components": "xyz", "type": "vec3", "vec4_index": 5}, "var_8": {"components": "w", "type": "float", "vec4_index": 2}, "var_9": {"components": "xyz", "type": "vec3", "vec4_index": 6}}},
    
  };

  // Variable to hold the current draw function
  let currentDraw = null;

  // Function to create/recreate the draw function
  function createDrawFunction(fragmentShader) {
    const command = regl({
      vert: `#version 300 es
      precision mediump float;
      in vec2 position;
      void main() {
        gl_Position = vec4(position, 0.0, 1.0);
      }`,

      frag: fragmentShader,

      attributes: {
        position: [
          [-1, -1],
          [ 1, -1],
          [-1,  1],
          [ 1,  1]
        ]
      },

      uniforms: {
        time: () => performance.now() / 1000,
        
        
        resolution: () => uniformValues.resolution,
        
        
        
        cameraAngleY: () => uniformValues.cameraAngleY,
        
        
        
        backgroundAzimuth: () => uniformValues.backgroundAzimuth,
        
        
        
        cameraDistance: () => uniformValues.cameraDistance,
        
        
        
        sunElevation: () => uniformValues.sunElevation,
        
        
        
        cameraOrigin: () => uniformValues.cameraOrigin,
        
        
        
        cameraAngleX: () => uniformValues.cameraAngleX,
        
        
        
        backgroundElevation: () => uniformValues.backgroundElevation,
        
        
        
        sunAzimuth: () => uniformValues.sunAzimuth,
        
        
      },

      primitive: 'triangle strip',
      count: 4
    });
    
    
    // Set up UBO bindings for ReGL (done after command creation)
    if (window.UBOLoader) {
      UBOLoader.setupUBOBindings(regl._gl, command._program);
    }
    
    
    return command;
  }

  
  // ReGL-specific button event listeners
  document.getElementById('reset-shader-code').addEventListener('click', () => {
    try {
      currentDraw = createDrawFunction(staticShaderCode);
      console.log('Shader code reset to static version');
    } catch (error) {
      console.error('Error resetting shader code:', error);
    }
  });

  document.getElementById('save-render').addEventListener('click', () => {
    saveRender(() => {
      if (currentDraw) {
        regl.clear({ color: [0, 0, 0, 1] });
        currentDraw();
      }
    });
  });

  // Reset button functionality
  document.getElementById('reset-shader').addEventListener('click', () => {
    resetUniformValues();
    
    // Reset shader code to original
    try {
      currentDraw = createDrawFunction(originalShaderCode);
      console.log('Shader reset to original version');
    } catch (error) {
      console.error('Error resetting to original shader:', error);
    }
  });
  

  // Initialize UBOs first
  
  if (window.UBOLoader) {
    UBOLoader.initializeUBOs(regl._gl, uboRegistry);
  }
  

  // Initialize the draw function
  currentDraw = createDrawFunction(originalShaderCode);

  // ReGL render loop
  regl.frame(() => {
    regl.clear({ color: [0, 0, 0, 1] });
    if (currentDraw) {
      currentDraw();
    }
  });
</script>
